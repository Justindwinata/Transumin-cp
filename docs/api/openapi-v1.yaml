openapi: 3.1.0
info:
  title: TRANSUM-IN NEXUS API
  version: 1.0.0-contract
  description: Canonical Phase 0.2 contract. No deployed server is asserted.
tags:
  - name: Transit Data
  - name: Scenarios
  - name: Simulation Runs
  - name: Operational Events
  - name: Journeys
  - name: Recoveries
  - name: Operator Recovery
  - name: Copilot
paths:
  /api/v1/transit/operators:
    get:
      operationId: listTransitOperators
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/CollectionResponse'}
  /api/v1/network/state:
    get:
      operationId: getNetworkState
      parameters:
        - {name: snapshot_id, in: query, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: entity_id, in: query, required: false, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: simulation_run_id, in: query, required: false, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {$ref: '#/components/responses/NetworkStateResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/network/entities/{entityId}:
    get:
      operationId: getNetworkEntity
      parameters:
        - {$ref: '#/components/parameters/EntityId'}
      responses:
        '200': {$ref: '#/components/responses/NetworkEntityResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/network/snapshots/{snapshotId}:
    get:
      operationId: getNetworkSnapshot
      parameters:
        - {$ref: '#/components/parameters/SnapshotId'}
      responses:
        '200': {$ref: '#/components/responses/NetworkSnapshotResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/disruption-events:
    post:
      security: [{internalBearer: []}]
      operationId: createDisruptionEvent
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DisruptionEventRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/DisruptionEventResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/disruption-events/{eventId}/impact:
    get:
      operationId: getDisruptionEventImpact
      parameters:
        - {$ref: '#/components/parameters/EventId'}
        - {name: snapshot_id, in: query, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: simulation_run_id, in: query, required: false, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {$ref: '#/components/responses/ImpactResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/scenarios:
    post:
      security: [{internalBearer: []}]
      tags: [Scenarios]
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScenarioCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/ScenarioResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/scenarios/{scenarioId}:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
    get:
      tags: [Scenarios]
      operationId: getScenario
      responses:
        '200': {$ref: '#/components/responses/ScenarioResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      security: [{internalBearer: []}]
      tags: [Scenarios]
      operationId: updateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScenarioPatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/ScenarioResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/scenarios/{scenarioId}/runs:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      security: [{internalBearer: []}]
      tags: [Simulation Runs]
      operationId: createSimulationRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRunCreateRequest'}
      responses:
        '202': {$ref: '#/components/responses/SimulationRunResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/simulation-runs/{runId}:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      tags: [Simulation Runs]
      operationId: getSimulationRun
      responses:
        '200': {$ref: '#/components/responses/SimulationRunResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/simulation-runs/{runId}/impact:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      tags: [Simulation Runs]
      operationId: getSimulationRunImpact
      responses:
        '200': {$ref: '#/components/responses/ImpactResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/operational-events/stream:
    get:
      tags: [Operational Events]
      operationId: streamOperationalEvents
      description: Server-Sent Events stream of safe operational summaries. Supports Last-Event-ID replay within the bounded process buffer and emits heartbeats.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Operational event stream
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/journeys/planning-health:
    get:
      tags: [Journeys]
      operationId: getPlanningHealth
      description: Point-in-time OTP GraphQL reachability, not route feasibility or live-data freshness. Independent of database-only /health/ready. Read-only; no owner data or credentials returned. Passenger proxy requires its signed session and service identity. No automatic polling; client may explicitly recheck. OTP probe bounded at 30 seconds; proxy 30 seconds and client 35 seconds remain unchanged.
      responses:
        '200':
          description: Probe completed, including OTP unavailable. Never cached.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, provider, version, checked_at, latency_milliseconds]
                    properties:
                      status: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
                      provider: {type: string, const: OTP}
                      version: {type: string}
                      checked_at: {type: string, format: date-time}
                      latency_milliseconds: {type: number, minimum: 0}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/plan:
    post:
      tags: [Journeys]
      operationId: planJourneys
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyPlanRequest'}
      responses:
        '200': {$ref: '#/components/responses/JourneyPlanResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    get:
      tags: [Journeys]
      operationId: getJourney
      responses:
        '200': {$ref: '#/components/responses/JourneyResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/activate:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
      - {$ref: '#/components/parameters/ActivationIdempotencyKey'}
    post:
      tags: [Journeys]
      operationId: activateJourney
      description: Creates a new owner-scoped active journey instance. The Idempotency-Key identifies one logical activation; retries with the same key and equivalent plan return the same instance, while a different plan body under the same key is a 409 conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyActivationRequest'}
      responses:
        '200': {$ref: '#/components/responses/JourneyResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/boarding/{legSequence}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
      - {name: legSequence, in: path, required: true, schema: {type: integer, minimum: 0}}
    post:
      tags: [Journeys]
      operationId: confirmLegBoarding
      description: Explicit passenger boarding confirmation for the current non-walking leg. Confirmation must never be derived from device GPS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyConfirmationRequest'}
      responses:
        '200': {$ref: '#/components/responses/JourneyResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/alighting/{legSequence}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
      - {name: legSequence, in: path, required: true, schema: {type: integer, minimum: 0}}
    post:
      tags: [Journeys]
      operationId: confirmLegAlighting
      description: Explicit passenger alighting confirmation after boarding for the same non-walking leg. Confirmation must never be derived from device GPS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyConfirmationRequest'}
      responses:
        '200': {$ref: '#/components/responses/JourneyResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/progress:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    patch:
      tags: [Journeys]
      operationId: updateJourneyProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyProgressRequest'}
      responses:
        '200': {$ref: '#/components/responses/JourneyResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/status:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    get:
      tags: [Journeys]
      operationId: getJourneyStatus
      responses:
        '200': {$ref: '#/components/responses/JourneyStatusResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/alerts:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    get:
      tags: [Journeys]
      operationId: listJourneyAlerts
      responses:
        '200': {$ref: '#/components/responses/JourneyAlertCollectionResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/journeys/{journeyId}/alerts/stream:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    get:
      tags: [Journeys]
      operationId: streamJourneyAlerts
      description: Owner- and journey-scoped Server-Sent Events stream. Targeted alerts are excluded from the public operational stream.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Targeted journey alert stream
          content:
            text/event-stream:
              schema: {type: string}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/recoveries:
    post:
      tags: [Recoveries]
      operationId: createRecovery
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/JourneyOwner'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/RecoveryResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/recoveries/{recoveryId}:
    parameters:
      - {$ref: '#/components/parameters/RecoveryId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    get:
      tags: [Recoveries]
      operationId: getRecovery
      responses:
        '200': {$ref: '#/components/responses/RecoveryResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/recoveries/{recoveryId}/accept:
    parameters:
      - {$ref: '#/components/parameters/RecoveryId'}
      - {$ref: '#/components/parameters/JourneyOwner'}
    post:
      tags: [Recoveries]
      operationId: acceptRecovery
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryAcceptRequest'}
      responses:
        '200': {$ref: '#/components/responses/RecoveryAcceptanceResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/operator-recovery/analyses:
    post:
      security: [{internalBearer: []}]
      tags: [Operator Recovery]
      operationId: createOperatorRecoveryAnalysis
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorAnalysisRequest'}
      responses:
        '201': {$ref: '#/components/responses/OperatorAnalysisResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/operator-recovery/analyses/{analysisId}:
    parameters:
      - {$ref: '#/components/parameters/AnalysisId'}
    get:
      security: [{internalBearer: []}]
      tags: [Operator Recovery]
      operationId: getOperatorRecoveryAnalysis
      responses:
        '200': {$ref: '#/components/responses/OperatorAnalysisResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/copilot/research/messages:
    post:
      security: [{internalBearer: []}]
      tags: [Copilot]
      operationId: createResearchCopilotMessage
      description: Authenticated RESEARCHER_OPERATOR or ADMIN only. Owner derives from principal user ID; request owner headers/body ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopilotMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/CopilotMessageResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/copilot/research/sessions/{sessionId}:
    get:
      security: [{internalBearer: []}]
      tags: [Copilot]
      operationId: getResearchCopilotSession
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {$ref: '#/components/responses/CopilotSessionResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/copilot/messages:
    post:
      tags: [Copilot]
      operationId: createCopilotMessage
      parameters:
        - {$ref: '#/components/parameters/JourneyOwner'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopilotMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/CopilotMessageResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/copilot/sessions/{sessionId}:
    get:
      tags: [Copilot]
      operationId: getCopilotSession
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/JourneyOwner'}
      responses:
        '200': {$ref: '#/components/responses/CopilotSessionResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/passenger-reports:
    post:
      tags: [Journeys]
      operationId: createPassengerReport
      description: Owner-scoped passenger report submission. Reports are unverified evidence until controlled review.
      parameters:
        - {$ref: '#/components/parameters/JourneyOwner'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PassengerReportCreateRequest'}
      responses:
        '200': {$ref: '#/components/responses/PassengerReportResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '429':
          description: Owner-scoped rolling quota reached; no report inserted. Retry-After is whole seconds until earliest slot.
          headers:
            Retry-After: {schema: {type: integer, minimum: 0}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    get:
      tags: [Journeys]
      operationId: listPassengerReportsByJourney
      description: Owner-scoped refresh list of journey-associated passenger reports. Supply idempotency_key to reconcile a single previously submitted attempt without listing the journey.
      parameters:
        - {$ref: '#/components/parameters/JourneyOwner'}
        - {name: active_journey_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: idempotency_key, in: query, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$', minLength: 8, maxLength: 128}}
      responses:
        '200':
          description: Journey list, or one report (null while absent) when idempotency_key is supplied. Absence does not prove rollback.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - {type: array, items: {$ref: '#/components/schemas/PassengerReport'}}
                      - {$ref: '#/components/schemas/PassengerReport'}
                      - {type: 'null'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/passenger-reports/{reportId}:
    parameters:
      - {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      - {$ref: '#/components/parameters/JourneyOwner'}
    get:
      tags: [Journeys]
      operationId: getPassengerReport
      responses:
        '200': {$ref: '#/components/responses/PassengerReportResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/admin/passenger-reports:
    get:
      tags: [Journeys]
      operationId: listAdminPassengerReports
      description: ADMIN-only latest 100 reports with private review references and current expiry/lifecycle. Authenticated server principal; never passenger service credentials.
      security: [{operatorSession: []}]
      responses:
        '200':
          description: Latest reports, newest first. restriction_active is evaluated at response time.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminPassengerReport'}}
                  meta: {type: object, properties: {limit: {type: integer, const: 100}}}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/admin/passenger-reports/{reportId}/restrict:
    post:
      tags: [Journeys]
      operationId: restrictAdminPassengerReport
      description: ADR-010 ADMIN field review, not official operator evidence. Requires current documented observation and public reason; private evidence reference never enters public incident provenance. Identical claim replays; conflicting evidence fails.
      security: [{operatorSession: []}]
      parameters:
        - {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRestrictionRequest'}
      responses:
        '201':
          description: Restriction applied or identical claim replayed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: object, required: [report_id, incident_id, verification_status], properties: {report_id: {$ref: '#/components/schemas/Uuid'}, incident_id: {$ref: '#/components/schemas/Uuid'}, verification_status: {type: string, const: ADMIN_RESTRICTED}, review_replay: {type: boolean}, evidence_status: {type: string}}}
                  meta: {type: object}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/admin/passenger-reports/{reportId}/close:
    post:
      tags: [Journeys]
      operationId: closeAdminPassengerReport
      description: ADMIN can resolve/retract only ADMIN_FIELD_REVIEW incidents; actor and public reason are journaled. History is retained.
      security: [{operatorSession: []}]
      parameters:
        - {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlledPassengerReportCloseRequest'}
      responses:
        '201': {$ref: '#/components/responses/ControlledPassengerReportCloseResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/controlled/passenger-reports/{reportId}/verify:
    post:
      tags: [Journeys]
      operationId: verifyControlledPassengerReport
      description: Trusted operator-controlled verification of one passenger report into verified SIMULATED incident evidence. Production remains fail-closed.
      parameters:
        - {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlledPassengerReportVerifyRequest'}
      responses:
        '200': {$ref: '#/components/responses/ControlledPassengerReportVerifyResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/controlled/passenger-reports/{reportId}/close:
    post:
      tags: [Journeys]
      operationId: closeControlledPassengerReport
      description: Dev/test-only terminal of a controlled SIMULATED passenger review (Resolved = condition cleared, Retracted = assertion withdrawn). Keeps acceptance repeatable without permanently blocking planning.
      parameters:
        - {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlledPassengerReportCloseRequest'}
      responses:
        '200': {$ref: '#/components/responses/ControlledPassengerReportCloseResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/data-sources:
    get:
      tags: [Transit Data]
      operationId: listDataSources
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/DataSourceCollectionResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/transit/places:
    get:
      tags: [Transit Data]
      operationId: searchTransitPlaces
      description: Snapshot-scoped canonical stops/stations plus checksum-verified sparse local OSM address/POI nodes from matching spatial dataset. Not comprehensive geocoding; missing/corrupt local index preserves transit search.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 80}}
        - {name: snapshot_id, in: query, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {$ref: '#/components/responses/TransitPlaceCollectionResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/data-sources/{sourceId}/versions:
    get:
      tags: [Transit Data]
      operationId: listDataSourceVersions
      parameters:
        - {$ref: '#/components/parameters/SourceId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/DatasetVersionCollectionResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/experiments/replays:
    post:
      operationId: createExperimentReplay
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExperimentReplayRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/ExperimentResponse'}
  /api/v1/experiments/{experimentId}:
    get:
      operationId: getExperiment
      parameters:
        - {$ref: '#/components/parameters/ExperimentId'}
      responses:
        '200': {$ref: '#/components/responses/ExperimentResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: tnx_session
      description: Revocable server session from /auth/login. ADMIN role and Origin/CSRF required for admin mutations.
    internalBearer:
      type: http
      scheme: bearer
      description: Temporary protected internal/research boundary. Full identity and authorization remain deferred.
  parameters:
    EntityId: {name: entityId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    SnapshotId: {name: snapshotId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    EventId: {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    SourceId: {name: sourceId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ExperimentId: {name: experimentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}}
    ScenarioId: {name: scenarioId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    RunId: {name: runId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    JourneyId: {name: journeyId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    JourneyOwner: {name: x-journey-owner, in: header, required: true, description: Bounded opaque owner/session reference; not passenger PII., schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}}
    RecoveryId: {name: recoveryId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    AnalysisId: {name: analysisId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    ActivationIdempotencyKey: {name: Idempotency-Key, in: header, required: true, description: Logical activation idempotency key; retries with the same key and equivalent plan replay one server-generated instance., schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}}
  responses:
    TransitPlaceCollectionResponse:
      description: Snapshot-scoped canonical transit places
      content: {application/json: {schema: {$ref: '#/components/schemas/TransitPlaceCollectionEnvelope'}}}
    CollectionResponse:
      description: Cursor-paginated resource summaries
      content: {application/json: {schema: {$ref: '#/components/schemas/CollectionEnvelope'}}}
    DataSourceCollectionResponse:
      description: Cursor-paginated, read-only dataset source summaries
      content: {application/json: {schema: {$ref: '#/components/schemas/DataSourceCollectionEnvelope'}}}
    DatasetVersionCollectionResponse:
      description: Cursor-paginated, read-only dataset version summaries
      content: {application/json: {schema: {$ref: '#/components/schemas/DatasetVersionCollectionEnvelope'}}}
    NetworkStateResponse:
      description: Effective network state
      content: {application/json: {schema: {$ref: '#/components/schemas/NetworkStateEnvelope'}}}
    NetworkEntityResponse:
      description: Mobility entity
      content: {application/json: {schema: {$ref: '#/components/schemas/NetworkEntityEnvelope'}}}
    NetworkSnapshotResponse:
      description: Immutable network snapshot
      content: {application/json: {schema: {$ref: '#/components/schemas/NetworkSnapshotEnvelope'}}}
    DisruptionEventResponse:
      description: Disruption event
      content: {application/json: {schema: {$ref: '#/components/schemas/DisruptionEventEnvelope'}}}
    ExperimentResponse:
      description: Reproducible experiment resource
      content: {application/json: {schema: {$ref: '#/components/schemas/ExperimentEnvelope'}}}
    ScenarioResponse:
      description: Scenario resource
      content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioEnvelope'}}}
    SimulationRunResponse:
      description: Simulation run resource
      content: {application/json: {schema: {$ref: '#/components/schemas/SimulationRunEnvelope'}}}
    ImpactResponse:
      description: Run impact result
      content: {application/json: {schema: {$ref: '#/components/schemas/ImpactEnvelope'}}}
    JourneyPlanResponse:
      description: Candidate journeys
      content: {application/json: {schema: {$ref: '#/components/schemas/JourneyPlanEnvelope'}}}
    RecoveryAcceptanceResponse:
      description: Accepted recovery with immutable-plan pointer semantics
      content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryAcceptanceEnvelope'}}}
    JourneyResponse:
      description: Journey resource
      content: {application/json: {schema: {$ref: '#/components/schemas/JourneyEnvelope'}}}
    JourneyStatusResponse:
      description: Journey status
      content: {application/json: {schema: {$ref: '#/components/schemas/JourneyStatusEnvelope'}}}
    JourneyAlertCollectionResponse:
      description: Owner- and journey-scoped targeted alerts
      content: {application/json: {schema: {$ref: '#/components/schemas/JourneyAlertCollectionEnvelope'}}}
    RecoveryResponse:
      description: Recovery resource
      content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryEnvelope'}}}
    OperatorAnalysisResponse:
      description: Operator recovery analysis
      content: {application/json: {schema: {$ref: '#/components/schemas/OperatorAnalysisEnvelope'}}}
    CopilotMessageResponse:
      description: Grounded copilot response
      content: {application/json: {schema: {$ref: '#/components/schemas/CopilotMessageEnvelope'}}}
    CopilotSessionResponse:
      description: Owner-scoped copilot session audit, latest 100 messages
      content: {application/json: {schema: {$ref: '#/components/schemas/CopilotSessionEnvelope'}}}
    PassengerReportResponse:
      description: Owner-scoped passenger report
      content: {application/json: {schema: {$ref: '#/components/schemas/PassengerReportEnvelope'}}}
    PassengerReportCollectionResponse:
      description: Owner-scoped journey-associated passenger reports
      content: {application/json: {schema: {$ref: '#/components/schemas/PassengerReportCollectionEnvelope'}}}
    ControlledPassengerReportVerifyResponse:
      description: Controlled verification outcome
      content: {application/json: {schema: {$ref: '#/components/schemas/ControlledPassengerReportVerifyEnvelope'}}}
    ControlledPassengerReportCloseResponse:
      description: Controlled close outcome
      content: {application/json: {schema: {$ref: '#/components/schemas/ControlledPassengerReportCloseEnvelope'}}}
    ErrorResponse:
      description: Machine-readable error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    Uuid: {type: string, format: uuid}
    EvidenceType: {type: string, enum: [SCHEDULED, OBSERVED, LIVE, FORECAST, SIMULATED, ESTIMATED]}
    NullableEvidenceType: {type: [string, 'null'], enum: [SCHEDULED, OBSERVED, LIVE, FORECAST, SIMULATED, ESTIMATED, null]}
    AvailabilityState: {type: string, enum: [AVAILABLE, DEGRADED, DISRUPTED, UNAVAILABLE, RECOVERING, UNKNOWN]}
    FreshnessStatus: {type: string, enum: [FRESH, AGING, STALE, EXPIRED, UNKNOWN, NOT_YET_VALID]}
    RunStatus: {type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED]}
    ProvenanceSummary:
      type: object
      required: [evidence_type, reference_ids]
      properties:
        evidence_type: {$ref: '#/components/schemas/EvidenceType'}
        reference_ids: {type: array, items: {type: string}}
        observed_at: {type: [string, 'null'], format: date-time}
        limitations: {type: array, items: {type: string}}
    Meta:
      type: object
      required: [request_id, warnings]
      properties:
        request_id: {type: string}
        warnings: {type: array, items: {type: string}}
        provenance: {$ref: '#/components/schemas/ProvenanceSummary'}
        next_cursor: {type: [string, 'null']}
    CollectionEnvelope: {type: object, required: [data, meta], properties: {data: {type: array, items: {type: object, additionalProperties: true}}, meta: {$ref: '#/components/schemas/Meta'}}}
    TransitPlace:
      type: object
      additionalProperties: false
      required: [place_id, external_id, name, kind, product_mode, latitude, longitude, dataset_version_id, provenance]
      properties:
        place_id: {$ref: '#/components/schemas/Uuid'}
        external_id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [STOP, STATION, ADDRESS, POI]}
        product_mode: {type: [string, 'null'], enum: [TRANSJAKARTA, MIKROTRANS, KRL, MRT_JAKARTA, LRT_JAKARTA, LRT_JABODEBEK, null], description: Null only for ADDRESS/POI; canonical STOP/STATION retain transit mode.}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        dataset_version_id: {$ref: '#/components/schemas/Uuid'}
        provenance: {type: string, enum: [OFFICIAL_TRANSJAKARTA_GTFS, OSM_OFFICIAL_CORROBORATED_TOPOLOGY, OSM_LOCAL_BOUNDED_INDEX]}
    TransitPlaceCollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/TransitPlace'}}
        meta: {$ref: '#/components/schemas/Meta'}
    DataSource:
      type: object
      additionalProperties: false
      required: [source_id, source_key, name, provider, source_type, canonical_url, license_name, license_url, access_method, access_notes, coverage_notes, redistribution_rule, verification_status, active, created_at, updated_at]
      properties:
        source_id: {$ref: '#/components/schemas/Uuid'}
        source_key: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        provider: {type: string, minLength: 1}
        source_type: {type: string, minLength: 1}
        canonical_url: {type: [string, 'null'], format: uri}
        license_name: {type: [string, 'null']}
        license_url: {type: [string, 'null'], format: uri}
        access_method: {type: [string, 'null']}
        access_notes: {type: [string, 'null']}
        coverage_notes: {type: [string, 'null']}
        redistribution_rule: {type: [string, 'null']}
        verification_status: {type: string, enum: [NOT_VERIFIED, VERIFIED, REJECTED]}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DatasetVersion:
      type: object
      additionalProperties: false
      required: [dataset_version_id, source_id, version_label, checksum_sha256, retrieved_at, effective_from, effective_to, raw_path_ref, manifest_path, validation_status]
      properties:
        dataset_version_id: {$ref: '#/components/schemas/Uuid'}
        source_id: {$ref: '#/components/schemas/Uuid'}
        version_label: {type: string, minLength: 1}
        checksum_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        retrieved_at: {type: string, format: date-time}
        effective_from: {type: [string, 'null'], format: date-time}
        effective_to: {type: [string, 'null'], format: date-time}
        raw_path_ref: {type: string, minLength: 1}
        manifest_path: {type: string, minLength: 1}
        validation_status: {type: string, enum: [PENDING, VALID, WARNING, INVALID]}
    DataSourceCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DataSource'}}
        meta: {$ref: '#/components/schemas/Meta'}
    DatasetVersionCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DatasetVersion'}}
        meta: {$ref: '#/components/schemas/Meta'}
    NetworkEntity:
      type: object
      required: [mobility_entity_id, entity_type, availability, evidence_type, freshness_status, observed_at, expires_at, provenance_ref]
      properties: {mobility_entity_id: {$ref: '#/components/schemas/Uuid'}, entity_type: {type: string, enum: [STOP, STATION, ROUTE, TRANSIT_SEGMENT, TRANSFER, ROAD_SEGMENT, WALKING_EDGE, RAIL_TOPOLOGY_EDGE]}, availability: {$ref: '#/components/schemas/AvailabilityState'}, evidence_type: {$ref: '#/components/schemas/NullableEvidenceType'}, freshness_status: {$ref: '#/components/schemas/FreshnessStatus'}, observed_at: {type: [string, 'null'], format: date-time}, expires_at: {type: [string, 'null'], format: date-time}, provenance_ref: {type: [string, 'null']}}
    NetworkStateItem:
      type: object
      required: [mobility_entity_id, availability, evidence_type, freshness_status, observed_at, expires_at, provenance_ref]
      properties: {mobility_entity_id: {$ref: '#/components/schemas/Uuid'}, availability: {$ref: '#/components/schemas/AvailabilityState'}, evidence_type: {$ref: '#/components/schemas/NullableEvidenceType'}, freshness_status: {$ref: '#/components/schemas/FreshnessStatus'}, observed_at: {type: [string, 'null'], format: date-time}, expires_at: {type: [string, 'null'], format: date-time}, provenance_ref: {type: [string, 'null']}}
    NetworkEntityEnvelope: {type: object, required: [data, meta], properties: {data: {$ref: '#/components/schemas/NetworkEntity'}, meta: {$ref: '#/components/schemas/Meta'}}}
    NetworkStateEnvelope: {type: object, required: [data, meta], properties: {data: {type: object, required: [network_snapshot_id, entities], properties: {network_snapshot_id: {$ref: '#/components/schemas/Uuid'}, simulation_run_id: {$ref: '#/components/schemas/Uuid'}, entities: {type: array, items: {$ref: '#/components/schemas/NetworkStateItem'}}}}, meta: {$ref: '#/components/schemas/Meta'}}}
    NetworkSnapshotEnvelope: {type: object, required: [data, meta], properties: {data: {type: object, required: [network_snapshot_id, captured_at, state_cutoff_at, fingerprint, dataset_version_ids, processing_version, status, materialized_state_count], properties: {network_snapshot_id: {$ref: '#/components/schemas/Uuid'}, captured_at: {type: string, format: date-time}, state_cutoff_at: {type: string, format: date-time}, fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}, dataset_version_ids: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/Uuid'}}, processing_version: {type: string}, status: {type: string, enum: [DRAFT, FINALIZED]}, materialized_state_count: {type: integer, minimum: 0}}}, meta: {$ref: '#/components/schemas/Meta'}}}
    DisruptionEventRequest:
      type: object
      required: [event_type, geometry, effective_from, evidence_type, provenance]
      properties: {event_type: {type: string, enum: [FLOOD]}, geometry: {type: object, description: Validated GeoJSON geometry}, effective_from: {type: string, format: date-time}, effective_to: {type: [string, 'null'], format: date-time}, evidence_type: {$ref: '#/components/schemas/EvidenceType'}, provenance: {$ref: '#/components/schemas/ProvenanceSummary'}}
    DisruptionEventEnvelope: {type: object, required: [data, meta], properties: {data: {allOf: [{$ref: '#/components/schemas/DisruptionEventRequest'}, {type: object, required: [event_id], properties: {event_id: {$ref: '#/components/schemas/Uuid'}}}]}, meta: {$ref: '#/components/schemas/Meta'}}}
    ExperimentReplayRequest:
      type: object
      required: [network_snapshot_id, scenario_id, baseline_configuration, proposed_configuration, manifest_checksum]
      properties: {network_snapshot_id: {$ref: '#/components/schemas/Uuid'}, scenario_id: {$ref: '#/components/schemas/Uuid'}, baseline_configuration: {type: object, additionalProperties: true}, proposed_configuration: {type: object, additionalProperties: true}, manifest_checksum: {type: string}}
    ExperimentEnvelope: {type: object, required: [data, meta], properties: {data: {type: object, required: [experiment_id, status, manifest_checksum], properties: {experiment_id: {$ref: '#/components/schemas/Uuid'}, status: {$ref: '#/components/schemas/RunStatus'}, manifest_checksum: {type: string}, result_references: {type: array, items: {type: string}}}}, meta: {$ref: '#/components/schemas/Meta'}}}
    ScenarioAction:
      type: object
      required: [mobility_entity_id, action_type, reason]
      properties:
        mobility_entity_id: {$ref: '#/components/schemas/Uuid'}
        action_type: {type: string, enum: [SET_AVAILABILITY, BLOCK_ENTITY, DEGRADE_ENTITY, RESTORE_ENTITY]}
        availability: {$ref: '#/components/schemas/AvailabilityState'}
        reason: {type: string}
        parameters: {type: object, additionalProperties: true}
    ScenarioCreateRequest:
      type: object
      required: [name, actions]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        actions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ScenarioAction'}}
    ScenarioPatchRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        actions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ScenarioAction'}}
    Scenario:
      allOf:
        - {$ref: '#/components/schemas/ScenarioCreateRequest'}
        - type: object
          required: [scenario_id, version, status]
          properties:
            scenario_id: {$ref: '#/components/schemas/Uuid'}
            version: {type: integer, minimum: 1}
            status: {type: string, enum: [DRAFT, READY, ARCHIVED]}
    ScenarioEnvelope: {type: object, required: [data, meta], properties: {data: {$ref: '#/components/schemas/Scenario'}, meta: {$ref: '#/components/schemas/Meta'}}}
    SimulationRunCreateRequest:
      type: object
      required: [network_snapshot_id, configuration]
      properties:
        network_snapshot_id: {$ref: '#/components/schemas/Uuid'}
        configuration: {type: object, additionalProperties: true}
    SimulationRun:
      type: object
      required: [simulation_run_id, scenario_id, network_snapshot_id, status, created_at]
      properties:
        simulation_run_id: {$ref: '#/components/schemas/Uuid'}
        scenario_id: {$ref: '#/components/schemas/Uuid'}
        network_snapshot_id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/RunStatus'}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        failure_code: {type: [string, 'null']}
    SimulationRunEnvelope: {type: object, required: [data, meta], properties: {data: {$ref: '#/components/schemas/SimulationRun'}, meta: {$ref: '#/components/schemas/Meta'}}}
    ImpactResult:
      type: object
      required: [impact_id, affected_entities, provenance]
      properties:
        impact_id: {$ref: '#/components/schemas/Uuid'}
        simulation_run_id: {anyOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        affected_entities: {type: array, items: {type: object, required: [mobility_entity_id, availability], properties: {mobility_entity_id: {$ref: '#/components/schemas/Uuid'}, availability: {$ref: '#/components/schemas/AvailabilityState'}, direct: {type: boolean}, rule_reference: {type: string}}}}
        metrics:
          type: object
          additionalProperties: false
          required: [directly_exposed, confirmed_unavailable, components_before, components_after, connectivity_loss, isolated_entities, affected_routes, affected_segments, unresolved_entities, runtime_ms]
          properties:
            directly_exposed: {type: integer, minimum: 0}
            confirmed_unavailable: {type: integer, minimum: 0}
            components_before: {type: integer, minimum: 0}
            components_after: {type: integer, minimum: 0}
            connectivity_loss: {type: integer, minimum: 0}
            isolated_entities: {type: integer, minimum: 0}
            affected_routes: {type: integer, minimum: 0}
            affected_segments: {type: integer, minimum: 0}
            unresolved_entities: {type: integer, minimum: 0}
            runtime_ms: {type: number, minimum: 0}
        provenance: {$ref: '#/components/schemas/ProvenanceSummary'}
    ImpactEnvelope: {type: object, required: [data, meta], properties: {data: {$ref: '#/components/schemas/ImpactResult'}, meta: {$ref: '#/components/schemas/Meta'}}}
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties: {latitude: {type: number, minimum: -90, maximum: 90}, longitude: {type: number, minimum: -180, maximum: 180}}
    JourneyPlanRequest:
      type: object
      additionalProperties: false
      required: [origin, destination, departure_at, network_snapshot_id]
      properties:
        origin: {$ref: '#/components/schemas/GeoPoint'}
        destination: {$ref: '#/components/schemas/GeoPoint'}
        departure_at: {type: string, format: date-time}
        network_snapshot_id: {$ref: '#/components/schemas/Uuid'}
        simulation_run_id: {$ref: '#/components/schemas/Uuid'}
        preference: {type: string, enum: [BALANCED, FASTEST, FEWEST_TRANSFERS, LEAST_WALKING]}
    JourneyEntityBinding:
      type: object
      additionalProperties: false
      required: [otp_entity_id, canonical_entity_id, mobility_entity_id, entity_type, resolution_method, provenance_ref]
      properties:
        otp_entity_id: {type: string}
        canonical_entity_id: {$ref: '#/components/schemas/Uuid'}
        mobility_entity_id: {anyOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        entity_type: {type: string, enum: [STOP, STATION, ROUTE]}
        resolution_method: {type: string, enum: [EXACT_SOURCE_REFERENCE, OPERATOR_SCOPED_EXACT_ALIAS, CONTROLLED_ROUTING_IDENTITY]}
        provenance_ref: {type: string}
    JourneyOperationalFlag:
      type: object
      additionalProperties: false
      required: [mobility_entity_id, availability, evidence_type, freshness_status, provenance_ref]
      properties:
        mobility_entity_id: {$ref: '#/components/schemas/Uuid'}
        availability: {type: string, enum: [DEGRADED, DISRUPTED]}
        evidence_type: {$ref: '#/components/schemas/NullableEvidenceType'}
        freshness_status: {$ref: '#/components/schemas/FreshnessStatus'}
        provenance_ref: {type: [string, 'null']}
    JourneyEndpoint:
      type: object
      additionalProperties: false
      required: [name, otp_stop_id]
      properties:
        name: {type: string}
        otp_stop_id: {type: [string, 'null']}
        latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
        longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
    JourneyGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [LineString]}
        coordinates: {type: array, minItems: 2, items: {type: array, minItems: 2, maxItems: 2, items: {type: number, description: '[longitude, latitude]'}}}
    JourneyWalkingStep:
      type: object
      additionalProperties: false
      required: [latitude, longitude, distance_meters, relative_direction, absolute_direction, street_name, bogus_name, area, stay_on]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        distance_meters: {type: number, minimum: 0}
        relative_direction: {type: [string, 'null']}
        absolute_direction: {type: [string, 'null']}
        street_name: {type: [string, 'null']}
        bogus_name: {type: boolean}
        area: {type: boolean}
        stay_on: {type: boolean}
    JourneySegment:
      type: object
      additionalProperties: false
      required: [sequence, mode, otp_mode, from, to, start_at, end_at, duration_seconds, distance_meters, route_id, route_short_name, trip_id, service_date, timing_precision, geometry, walking_steps, evidence_type, entity_bindings, operational_flags]
      properties:
